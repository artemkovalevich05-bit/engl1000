<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121212" />
  <title>1000 Words</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #f5f5f5;
      --muted: #9e9e9e;
      --accent: #3b82f6;
      --yellow: #eab308;
      --green: #22c55e;
      --border: #2e2e2e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 90px;
      display: flex;
      flex-direction: column;
    }
    .screen { display: none; flex-direction: column; flex: 1; }
    .screen.active { display: flex; }

    /* Картка тренування */
    .card-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .word-card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 24px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.4;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .translation { font-weight: 400; color: #d4d4d4; }
    .action-btn {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .action-btn.next { background: var(--green); color: #052e16; }
    .action-btn:active { transform: scale(0.98); }

    /* Список блоків */
    .hint {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 14px;
      text-align: center;
    }
    .block-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      cursor: pointer;
    }
    .block-item.learning { border-color: var(--yellow); }
    .block-item.learned { border-color: var(--green); opacity: 0.75; }
    .badge { font-weight: 600; font-size: 14px; }

    /* Статистика */
    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      font-size: 17px;
    }
    .stat-num { font-size: 26px; font-weight: 700; margin-top: 6px; }

    /* Нижнє меню */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: #181818;
      border-top: 1px solid var(--border);
      display: flex;
    }
    nav button {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }
    nav button.active { color: var(--accent); font-weight: 600; }
    nav button span.ico { font-size: 22px; }
  </style>
</head>
<body>

<main>
  <!-- ЕКРАН 1: ТРЕНУВАННЯ -->
  <section id="screen-train" class="screen active">
    <div class="card-wrapper">
      <div id="word-box" class="word-card">Завантаження...</div>
      <button id="main-btn" class="action-btn" onclick="handleMainBtn()">👁 Відкрити переклад</button>
    </div>
  </section>

  <!-- ЕКРАН 2: БЛОКИ -->
  <section id="screen-blocks" class="screen">
    <div class="hint">Натискай на блок: ⬜ Не обрано → 🟡 Вчу → ✅ Вивчено</div>
    <div id="blocks-list"></div>
  </section>

  <!-- ЕКРАН 3: ПРОГРЕС -->
  <section id="screen-stats" class="screen">
    <div class="stat-box">🟡 Зараз вчиш:<div id="stat-learning" class="stat-num">0 слів</div></div>
    <div class="stat-box">✅ Вже вивчено:<div id="stat-learned" class="stat-num">0 слів</div></div>
    <div class="stat-box">📦 Всього у словнику:<div id="stat-total" class="stat-num">0 слів</div></div>
  </section>
</main>

<nav>
  <button class="active" onclick="switchTab('train', this)"><span class="ico">🎯</span>Тренування</button>
  <button onclick="switchTab('blocks', this)"><span class="ico">📚</span>Блоки</button>
  <button onclick="switchTab('stats', this)"><span class="ico">📊</span>Прогрес</button>
</nav>

<script>
  const BLOCK_SIZE = 20;
  const STORAGE_KEY = "vocab_blocks_progress_v1";

  let words = [];
  let progress = {}; // { "0": "learning", "1": "learned" }
  let currentWordIdx = -1;
  let isRevealed = false;

  async function init() {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    const res = await fetch("words.json");
    words = await res.json();

    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      progress = JSON.parse(saved);
    } else {
      progress = { "0": "learning" }; // 1-й блок увімкнений одразу
      saveProgress();
    }
    nextWord();
  }

  function saveProgress() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }

  function getActiveIndices() {
    const indices = [];
    const totalBlocks = Math.ceil(words.length / BLOCK_SIZE);
    for (let b = 0; b < totalBlocks; b++) {
      if (progress[String(b)] === "learning") {
        const start = b * BLOCK_SIZE;
        const end = Math.min((b + 1) * BLOCK_SIZE, words.length);
        for (let i = start; i < end; i++) indices.push(i);
      }
    }
    return indices;
  }

  function nextWord() {
    const pool = getActiveIndices();
    const box = document.getElementById("word-box");
    const btn = document.getElementById("main-btn");

    if (pool.length === 0) {
      currentWordIdx = -1;
      box.innerHTML = `<span style="font-size:18px;color:#9e9e9e;">Немає блоків зі статусом «🟡 Вчу».<br>Обери їх у вкладці «Блоки».</span>`;
      btn.style.display = "none";
      return;
    }

    btn.style.display = "block";
    let filtered = pool.length > 1 ? pool.filter(i => i !== currentWordIdx) : pool;
    currentWordIdx = filtered[Math.floor(Math.random() * filtered.length)];
    isRevealed = false;

    box.innerHTML = `<span>${words[currentWordIdx].en}</span>`;
    btn.textContent = "👁 Відкрити переклад";
    btn.classList.remove("next");
  }

  function handleMainBtn() {
    if (currentWordIdx === -1) return;
    if (!isRevealed) {
      isRevealed = true;
      const w = words[currentWordIdx];
      document.getElementById("word-box").innerHTML =
        `<span>${w.en} <span class="translation">— ${w.ua}</span></span>`;
      const btn = document.getElementById("main-btn");
      btn.textContent = "➡️ Наступне слово";
      btn.classList.add("next");
    } else {
      nextWord();
    }
  }

  function renderBlocks() {
    const list = document.getElementById("blocks-list");
    list.innerHTML = "";
    const totalBlocks = Math.ceil(words.length / BLOCK_SIZE);

    for (let b = 0; b < totalBlocks; b++) {
      const status = progress[String(b)] || "none";
      const from = b * BLOCK_SIZE + 1;
      const to = Math.min((b + 1) * BLOCK_SIZE, words.length);

      let badge = "⬜ Не обрано";
      if (status === "learning") badge = "🟡 Вчу";
      if (status === "learned") badge = "✅ Вивчено";

      const div = document.createElement("div");
      div.className = `block-item ${status}`;
      div.innerHTML = `<span><strong>Блок ${b + 1}</strong> (${from}–${to})</span><span class="badge">${badge}</span>`;
      div.onclick = () => {
        const nextStatus = status === "none" ? "learning" : status === "learning" ? "learned" : "none";
        if (nextStatus === "none") delete progress[String(b)];
        else progress[String(b)] = nextStatus;
        saveProgress();
        renderBlocks();
      };
      list.appendChild(div);
    }
  }

  function renderStats() {
    let learningBlocks = 0;
    let learnedBlocks = 0;
    Object.values(progress).forEach(st => {
      if (st === "learning") learningBlocks++;
      if (st === "learned") learnedBlocks++;
    });
    document.getElementById("stat-learning").textContent = `${learningBlocks} блоків (~${learningBlocks * BLOCK_SIZE} слів)`;
    document.getElementById("stat-learned").textContent = `${learnedBlocks} блоків (~${learnedBlocks * BLOCK_SIZE} слів)`;
    document.getElementById("stat-total").textContent = `${words.length} слів`;
  }

  function switchTab(tab, btnEl) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
    document.getElementById(`screen-${tab}`).classList.add("active");
    btnEl.classList.add("active");

    if (tab === "train") nextWord();
    if (tab === "blocks") renderBlocks();
    if (tab === "stats") renderStats();
  }

  init();
</script>
</body>
</html>
